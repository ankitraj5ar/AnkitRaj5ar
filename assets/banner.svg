<svg viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg" width="900" height="220">
  <defs>
    <pattern id="grid" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#30363d" opacity="0.6"/>
    </pattern>
    <linearGradient id="fade-left" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="1"/>
      <stop offset="30%" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fade-right" x1="0" y1="0" x2="1" y2="0">
      <stop offset="70%" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="accent-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="20%" stop-color="#388bfd" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#388bfd"/>
      <stop offset="80%" stop-color="#388bfd" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="220" fill="#0d1117"/>

  <!-- Dot grid -->
  <rect width="900" height="220" fill="url(#grid)"/>

  <!-- Edge vignettes -->
  <rect width="900" height="220" fill="url(#fade-left)"/>
  <rect width="900" height="220" fill="url(#fade-right)"/>

  <!-- Accent corner marks — top-left -->
  <line x1="40" y1="30" x2="70" y2="30" stroke="#388bfd" stroke-width="1.5" opacity="0.7"/>
  <line x1="40" y1="30" x2="40" y2="60" stroke="#388bfd" stroke-width="1.5" opacity="0.7"/>

  <!-- Accent corner marks — top-right -->
  <line x1="860" y1="30" x2="830" y2="30" stroke="#388bfd" stroke-width="1.5" opacity="0.7"/>
  <line x1="860" y1="30" x2="860" y2="60" stroke="#388bfd" stroke-width="1.5" opacity="0.7"/>

  <!-- Accent corner marks — bottom-left -->
  <line x1="40" y1="190" x2="70" y2="190" stroke="#388bfd" stroke-width="1.5" opacity="0.7"/>
  <line x1="40" y1="190" x2="40" y2="160" stroke="#388bfd" stroke-width="1.5" opacity="0.7"/>

  <!-- Accent corner marks — bottom-right -->
  <line x1="860" y1="190" x2="830" y2="190" stroke="#388bfd" stroke-width="1.5" opacity="0.7"/>
  <line x1="860" y1="190" x2="860" y2="160" stroke="#388bfd" stroke-width="1.5" opacity="0.7"/>

  <!-- Vertical accent lines flanking name -->
  <line x1="180" y1="64" x2="180" y2="156" stroke="#388bfd" stroke-width="0.5" opacity="0.3"/>
  <line x1="720" y1="64" x2="720" y2="156" stroke="#388bfd" stroke-width="0.5" opacity="0.3"/>

  <!-- Name — primary identity -->
  <text
    x="450" y="118"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, monospace"
    font-size="52"
    font-weight="300"
    letter-spacing="12"
    fill="#e6edf3">
    [YOUR_NAME]
  </text>

  <!-- Role / tagline -->
  <text
    x="450" y="155"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, monospace"
    font-size="12"
    font-weight="400"
    letter-spacing="4"
    fill="#8b949e">
    [YOUR_TAGLINE] · [LOCATION]
  </text>

  <!-- Bottom accent line -->
  <line x1="0" y1="205" x2="900" y2="205" stroke="url(#accent-line)" stroke-width="1"/>
</svg>
