<svg width="1600" height="420" viewBox="0 0 1600 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .eyebrow {
      fill: #57606A;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 20px;
      font-weight: 650;
      letter-spacing: 5px;
    }

    .title {
      fill: #24292F;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 96px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .subtitle {
      fill: #57606A;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 32px;
      font-weight: 420;
    }

    .note {
      fill: #6E7781;
      font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 22px;
    }

    @media (prefers-color-scheme: dark) {
      .eyebrow { fill: #8B949E; }
      .title { fill: #F0F6FC; }
      .subtitle { fill: #8B949E; }
      .note { fill: #6E7681; }
    }

  </style>

  <g transform="translate(92 106)">
    <text class="eyebrow" x="0" y="0" opacity="0">
      BACKEND DEVELOPER
      <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 8;0 0" dur="0.8s" begin="0s" fill="freeze"/>
    </text>

    <text class="title" x="0" y="112" opacity="0">
      Ankit Raj
      <animate attributeName="opacity" values="0;1" dur="1s" begin="0.15s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="1s" begin="0.15s" fill="freeze"/>
    </text>

    <text class="subtitle" x="2" y="178" opacity="0">
      Distributed systems / APIs / infrastructure
      <animate attributeName="opacity" values="0;1" dur="1s" begin="0.35s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 8;0 0" dur="1s" begin="0.35s" fill="freeze"/>
    </text>

    <text class="note" x="2" y="232" opacity="0">
      reliable systems, written with clarity
      <animate attributeName="opacity" values="0;1" dur="1s" begin="0.55s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 8;0 0" dur="1s" begin="0.55s" fill="freeze"/>
    </text>
  </g>
</svg>
