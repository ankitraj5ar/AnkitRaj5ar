<svg
  width="1600"
  height="420"
  viewBox="0 0 1600 420"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <rect x="12" y="12" width="1576" height="396" rx="22" fill="url(#checker)">
    <animate
      attributeName="opacity"
      values="0.95;1;0.95"
      dur="6s"
      repeatCount="indefinite"
    />
  </rect>

  <!-- Overlay -->
  <rect x="12" y="12" width="1576" height="396" rx="22" fill="url(#overlay)" />

  <!-- Moving Scan Line -->
  <rect
    x="-500"
    y="0"
    width="260"
    height="420"
    fill="url(#scan)"
    transform="rotate(8 800 200)"
  >
    <animate
      attributeName="x"
      values="-500;1800"
      dur="7s"
      repeatCount="indefinite"
    />
  </rect>

  <!-- Floating Dots -->
  <g>
    <circle cx="210" cy="110" r="4" fill="#A5B4FC">
      <animate
        attributeName="cy"
        values="110;80;110"
        dur="4s"
        repeatCount="indefinite"
      />
      <animate
        attributeName="opacity"
        values="0.2;1;0.2"
        dur="4s"
        repeatCount="indefinite"
      />
    </circle>

    <circle cx="460" cy="300" r="3" fill="#FFFFFF">
      <animate
        attributeName="cy"
        values="300;260;300"
        dur="5s"
        repeatCount="indefinite"
      />
      <animate
        attributeName="opacity"
        values="0.2;0.9;0.2"
        dur="5s"
        repeatCount="indefinite"
      />
    </circle>

    <circle cx="880" cy="150" r="5" fill="#818CF8">
      <animate
        attributeName="cy"
        values="150;120;150"
        dur="6s"
        repeatCount="indefinite"
      />
      <animate
        attributeName="opacity"
        values="0.1;1;0.1"
        dur="6s"
        repeatCount="indefinite"
      />
    </circle>

    <circle cx="1240" cy="250" r="4" fill="#C4B5FD">
      <animate
        attributeName="cy"
        values="250;210;250"
        dur="7s"
        repeatCount="indefinite"
      />
      <animate
        attributeName="opacity"
        values="0.1;1;0.1"
        dur="7s"
        repeatCount="indefinite"
      />
    </circle>
  </g>

  <!-- Main Text -->
  <text
    x="70"
    y="180"
    font-family="monospace"
    font-size="74"
    font-weight="700"
    fill="url(#textGradient)"
  >
    Hey, I am

    <animate attributeName="opacity" values="0;1" dur="1.5s" fill="freeze" />
    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 0;0 -3;0 0"
      dur="4s"
      repeatCount="indefinite"
    />
  </text>

  <!-- Name Typing Effect -->
  <text
    x="70"
    y="255"
    font-family="monospace"
    font-size="62"
    font-weight="700"
    fill="#FFFFFF"
  >
    Ankit Raj

    <animate attributeName="opacity" values="0;1" dur="2s" fill="freeze" />
  </text>

  <!-- Subtitle -->
  <text
    x="72"
    y="325"
    font-family="monospace"
    font-size="34"
    fill="#9CA3AF"
    letter-spacing="1"
  >
    Backend Developer • Distributed Systems

    <animate attributeName="opacity" values="0;0.9" dur="3s" fill="freeze" />
  </text>

  <!-- Blinking Cursor -->
  <rect x="565" y="210" width="14" height="56" fill="#818CF8">
    <animate
      attributeName="opacity"
      values="1;0;1"
      dur="1s"
      repeatCount="indefinite"
    />
  </rect>

  <!-- Right Side Icon -->
  <g transform="translate(1330 95)">
    <circle cx="90" cy="90" r="92" fill="#FFFFFF">
      <animate
        attributeName="opacity"
        values="0.95;1;0.95"
        dur="4s"
        repeatCount="indefinite"
      />
    </circle>

    <path
      d="M92 28C57 28 28 57 28 92C28 120 46 143 71 152C75 153 77 150 77 147V136C48 142 42 122 42 122C37 110 30 107 30 107C20 100 31 100 31 100C42 101 48 111 48 111C58 128 74 123 80 120C81 113 84 108 87 105C63 102 38 93 38 53C38 42 42 33 49 25C48 22 44 10 50 -6C50 -6 60 -9 78 4C87 1 97 0 107 0C117 0 127 1 136 4C154 -9 164 -6 164 -6C170 10 166 22 165 25C172 33 176 42 176 53C176 93 151 102 127 105C131 109 135 117 135 129V147C135 150 137 153 141 152C166 143 184 120 184 92C184 57 155 28 120 28H92Z"
      fill="#000000"
      transform="scale(0.7) translate(20 20)"
    >
      <animateTransform
        attributeName="transform"
        type="scale"
        values="0.7;0.74;0.7"
        dur="4s"
        repeatCount="indefinite"
        additive="sum"
      />
    </path>
  </g>

  <!-- Bottom Animated Line -->
  <line
    x1="40"
    y1="372"
    x2="1560"
    y2="372"
    stroke="#4F46E5"
    stroke-width="3"
    stroke-linecap="round"
  >
    <animate
      attributeName="stroke-dasharray"
      values="0 1600;1600 0;0 1600"
      dur="8s"
      repeatCount="indefinite"
    />
  </line>
</svg>
